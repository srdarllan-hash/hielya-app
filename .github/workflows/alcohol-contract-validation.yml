name: Alcohol Contract V1.3 Validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: alcohol-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/contracts/requirements.txt
      - run: python -m pip install -r tests/contracts/requirements.txt
      - run: python -m unittest discover -s tests/contracts -p 'test_*.py' -v
      - name: Validation cannot modify contracts or test fixtures
        run: git diff --exit-code -- contracts tests
