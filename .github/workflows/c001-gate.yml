name: C-001 Splash Gate 1B

on:
  pull_request:
    branches:
      - hielya/codefirst-batch01

concurrency:
  group: c001-gate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate-c001:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GATE_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      GATE_SOURCE_BRANCH: ${{ github.head_ref }}
      C001_BASE_SHA: be61e1168b93d973101496cc66cb54d006aba9cc
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.GATE_SOURCE_SHA }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Runtime and frozen-base identity
        run: |
          node --version
          pnpm --version
          echo "GATE_SOURCE_SHA=$GATE_SOURCE_SHA"
          echo "GATE_SOURCE_BRANCH=$GATE_SOURCE_BRANCH"
          echo "C001_BASE_SHA=$C001_BASE_SHA"
          test "$(git rev-parse HEAD)" = "$GATE_SOURCE_SHA"
          git merge-base --is-ancestor "$C001_BASE_SHA" HEAD

      - name: Clean install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Build Next.js
        run: pnpm build

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Accessibility tests
        run: pnpm test:c001:a11y

      - name: Functional and console tests
        run: pnpm test:c001:functional

      - name: Visual and responsive tests
        run: pnpm test:c001:visual

      - name: Collect visual hashes
        run: pnpm collect:c001:visual

      - name: Scope and source audit
        run: pnpm audit:c001:scope

      - name: Manifest audit
        run: pnpm audit:c001:manifest

      - name: Generate commit-bound Gate evidence
        run: pnpm gate:c001:manifest

      - name: Upload Gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c001-gate-${{ env.GATE_SOURCE_SHA }}
          if-no-files-found: warn
          path: |
            pnpm-lock.yaml
            playwright-report/
            test-results/
            screenshots/c001/
            qa/c001/
            manifests/C-001*.json
            docs/c001/
            CHANGELOG.md
            README.md
