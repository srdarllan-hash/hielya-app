name: C-002 Source Export

on:
  pull_request:
    branches:
      - hielya/pre-gate2-architecture-consolidation

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact C-002 branch SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify canonical ancestry
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: c2857afe538b2cf5ba44635edd56dbd422c0e2f0
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          echo "repository=$GITHUB_REPOSITORY"
          echo "branch=${{ github.head_ref }}"
          echo "head SHA=$SOURCE_SHA"
      - name: Package exact source tree
        run: |
          mkdir -p source-export
          git archive --format=tar HEAD | tar -xf - -C source-export
          printf '%s\n' "${{ github.event.pull_request.head.sha }}" > source-export/SOURCE_SHA.txt
      - name: Upload exact source tree
        uses: actions/upload-artifact@v4
        with:
          name: c002-source-${{ github.event.pull_request.head.sha }}
          if-no-files-found: error
          include-hidden-files: true
          path: source-export/
