name: C-005 Home Gate 1A

on:
  pull_request:
    branches: [main]

concurrency:
  group: c005-gate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate-c005:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GATE_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      GATE_SOURCE_BRANCH: ${{ github.head_ref }}
      VISUAL_BASELINE_MODE: candidate
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.GATE_SOURCE_SHA }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Runtime versions and source identity
        run: |
          node --version
          pnpm --version
          echo "GATE_SOURCE_SHA=$GATE_SOURCE_SHA"
          echo "GATE_SOURCE_BRANCH=$GATE_SOURCE_BRANCH"
          test "$(git rev-parse HEAD)" = "$GATE_SOURCE_SHA"
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test:unit
      - name: Build Next.js
        run: pnpm build
      - name: Build Storybook
        run: pnpm build-storybook
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Accessibility tests
        run: pnpm test:a11y
      - name: Generate candidate visual baselines and responsive screenshots
        run: pnpm exec playwright test tests/visual --update-snapshots
      - name: Source and manifest audits
        run: |
          pnpm audit:source
          pnpm audit:manifest
      - name: Generate commit-bound Gate evidence
        run: pnpm gate:manifest
      - name: Upload Gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c005-baseline-candidate-${{ env.GATE_SOURCE_SHA }}
          if-no-files-found: warn
          path: |
            playwright-report/
            test-results/
            screenshots/
            tests/visual/home.visual.spec.ts-snapshots/
            qa/
            manifests/
            CHANGELOG.md
            README.md
