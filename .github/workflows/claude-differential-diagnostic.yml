name: Claude differential diagnostic (temporary)

# Issue #68: preparation only. Dispatch requires separate human authorization.
# One-shot investigation, not a permanent integration. Remove this workflow in
# a separately reviewed PR after investigation. attempt == 1 rejects reruns,
# but does not prevent a second manual dispatch: authorization is still required.
# Diagnostic completion is not evidence that either provider or CLI passed.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: claude-differential-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    if: >-
      github.actor == 'srdarllan-hash' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # No checkout, git, Action wrapper, repository scripts or artifact upload.
      - name: Provider and conditional CLI probe
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +x
          umask 077
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          import subprocess
          import tempfile
          import time

          def emit(data):
              # Call sites construct only fixed keys/enums, booleans and numbers.
              print(json.dumps(data, separators=(",", ":")), flush=True)

          def blocked():
              emit({"setup": "BLOCKED", "conclusion": "UNRESOLVED"})

          def main():
              key = os.environ.get("ANTHROPIC_API_KEY", "")
              if not key or any(c in key for c in "\r\n\0"):
                  blocked()
                  return

              with tempfile.TemporaryDirectory(prefix="claude-probe-") as tmp:
                  root = pathlib.Path(tmp)
                  os.chmod(root, 0o700)
                  work = root / "empty-workspace"
                  config = root / "cli-config"
                  work.mkdir()
                  config.mkdir()
                  # Child-only environment; the runner's HOME is never mutated.
                  clean = {"PATH": os.environ["PATH"], "LANG": "C.UTF-8"}
                  for name, folder in (
                      ("HOME", "home"),
                      ("XDG_CONFIG_HOME", "xdg-config"),
                      ("XDG_CACHE_HOME", "xdg-cache"),
                      ("XDG_STATE_HOME", "xdg-state"),
                      ("TMPDIR", "tmp"),
                  ):
                      path = root / folder
                      path.mkdir()
                      clean[name] = str(path)

                  payload = json.dumps({
                      "model": "claude-opus-5",
                      "max_tokens": 64,
                      "messages": [{"role": "user", "content": "Reply exactly OK"}],
                  })
                  started = time.monotonic()
                  # Key goes through stdin, never command-line arguments.
                  try:
                      result = subprocess.run(
                          [
                              "curl", "--disable", "--silent", "--retry", "0",
                              "--connect-timeout", "10", "--max-time", "60",
                              "--proto", "=https", "--request", "POST",
                              "--url", "https://api.anthropic.com/v1/messages",
                              "--header", "@-",
                              "--header", "anthropic-version: 2023-06-01",
                              "--header", "content-type: application/json",
                              "--data-raw", payload, "--output", "/dev/null",
                              "--write-out", "%{http_code}",
                          ],
                          input="x-api-key: " + key + "\n", text=True,
                          stdout=subprocess.PIPE, stderr=subprocess.DEVNULL,
                          env=clean, cwd=work, timeout=65, check=False,
                      )
                      transport_exit_code = result.returncode
                      code = result.stdout.strip()
                      http = int(code) if re.fullmatch(r"[1-5]\d\d", code) else None
                  except subprocess.TimeoutExpired:
                      # No completed exit status exists; do not invent one.
                      transport_exit_code = None
                      http = None
                  passed = (
                      transport_exit_code == 0 and http is not None and 200 <= http < 300
                  )
                  report = {
                      "test": "A", "http_status": http, "success": passed,
                      "duration_seconds": round(time.monotonic() - started, 3),
                  }
                  if transport_exit_code is not None:
                      report["transport_exit_code"] = transport_exit_code
                  emit(report)
                  if not passed:
                      emit({"conclusion": (
                          "PROVIDER_OR_CREDENTIAL_PATH"
                          if http is not None and http >= 400 else "UNRESOLVED"
                      )})
                      return

                  # Installation has no provider/GitHub credentials in its env.
                  install_env = dict(clean)
                  install_env["npm_config_cache"] = str(root / "npm-cache")
                  prefix = root / "cli"
                  cli = prefix / "bin" / "claude"
                  cli_config_env = dict(clean, CLAUDE_CONFIG_DIR=str(config))
                  try:
                      installed = subprocess.run(
                          ["npm", "install", "--global", "--prefix", str(prefix),
                           "--no-audit", "--no-fund", "--fetch-retries=0",
                           "@anthropic-ai/claude-code@2.1.263"],
                          env=install_env, cwd=work,
                          stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
                          timeout=180, check=False,
                      )
                      if installed.returncode != 0:
                          blocked()
                          return
                      version = subprocess.run(
                          [str(cli), "--version"], env=cli_config_env, cwd=work,
                          capture_output=True, text=True, timeout=15, check=False,
                      )
                      # Accept surrounding branding, reject other/ambiguous versions,
                      # prereleases, build suffixes and numeric-prefix matches.
                      versions = re.findall(
                          r"(?<![\w.])\d+\.\d+\.\d+(?:[-+][\w.-]+)?(?![\w.])",
                          version.stdout,
                      )
                      if version.returncode != 0 or versions != ["2.1.263"]:
                          blocked()
                          return
                  except subprocess.TimeoutExpired:
                      blocked()
                      return

                  cli_env = dict(cli_config_env)
                  cli_env.update({
                      "ANTHROPIC_API_KEY": key,
                      "CLAUDE_CODE_MAX_RETRIES": "0",
                      "CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC": "1",
                      "DISABLE_AUTOUPDATER": "1",
                  })
                  started = time.monotonic()
                  output = root / "stdout.json"
                  errors = root / "stderr.txt"
                  try:
                      with output.open("wb") as out, errors.open("wb") as err:
                          completed = subprocess.run(
                              [str(cli), "-p", "Reply exactly OK",
                               "--model", "claude-opus-5", "--output-format", "json",
                               "--max-turns", "1", "--max-budget-usd", "0.50",
                               "--tools", "", "--disallowedTools", "mcp__*",
                               "--strict-mcp-config", "--mcp-config", '{"mcpServers":{}}',
                               "--setting-sources", "",
                               "--settings", '{"disableAllHooks":true}',
                               "--disable-slash-commands", "--permission-mode", "dontAsk",
                               "--no-session-persistence"],
                              env=cli_env, cwd=work, stdout=out, stderr=err,
                              timeout=120, check=False,
                          )
                      exit_code = completed.returncode
                  except subprocess.TimeoutExpired:
                      exit_code = None

                  data = None
                  try:
                      if output.stat().st_size <= 1048576:
                          data = json.loads(output.read_text())
                  except (OSError, ValueError, UnicodeError):
                      pass
                  is_error = None
                  valid = False
                  if isinstance(data, dict):
                      if type(data.get("is_error")) is bool:
                          is_error = data["is_error"]
                      valid = (
                          exit_code == 0 and data.get("type") == "result" and
                          is_error is False and isinstance(data.get("result"), str) and
                          data["result"].strip() == "OK"
                      )
                  report = {
                      "test": "B", "exit_code": exit_code, "valid_result": valid,
                      "duration_seconds": round(time.monotonic() - started, 3),
                  }
                  if is_error is not None:
                      report["is_error"] = is_error
                  emit(report)
                  # Direction for investigation, never retrospective root-cause proof.
                  emit({"conclusion": (
                      "CLAUDE_CODE_ACTION_PATH" if valid else
                      "CLAUDE_CLI_OR_SDK_PATH"
                      if exit_code is not None and is_error is True else "UNRESOLVED"
                  )})

          try:
              main()
          except Exception:
              # Do not expose exception messages or stacks, even on setup failure.
              blocked()
          PY
