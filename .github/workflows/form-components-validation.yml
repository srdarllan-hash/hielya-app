name: Form Components Validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: form-components-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  form-components:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      STORYBOOK_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build-storybook
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: State accessibility, keyboard, paste and geometry (synthetic inputs only)
        run: pnpm exec playwright test --config playwright.form-components.config.ts --workers=2
      - name: Ensure validation did not modify source or baselines
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: form-components-${{ github.event.pull_request.head.sha }}
          path: playwright-report/form-components/
          if-no-files-found: warn
