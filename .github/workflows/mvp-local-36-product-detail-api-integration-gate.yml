name: MVP Local 36 Product Detail Public API Integration Gate

on:
  push:
    branches:
      - hielya/mvp-local-36-product-detail-api-integration

permissions:
  actions: read
  contents: read

concurrency:
  group: mvp-local-36-product-detail-api-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-detail-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FROZEN_PARENT_SHA: 274d72db6babbf2605d7fecc9946adb28fbd6593
      FROZEN_PARENT_BRANCH: hielya/mvp-local-36-home-catalog-api-integration
    steps:
      - name: Checkout exact child commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify child source, frozen ancestry and parent drift
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git cat-file -e "$FROZEN_PARENT_SHA^{commit}"
          git merge-base --is-ancestor "$FROZEN_PARENT_SHA" HEAD
          git fetch --no-tags --force origin \
            "refs/heads/$FROZEN_PARENT_BRANCH:refs/remotes/origin/$FROZEN_PARENT_BRANCH"
          test "$(git rev-parse "refs/remotes/origin/$FROZEN_PARENT_BRANCH")" = "$FROZEN_PARENT_SHA"
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate Product Detail scope, routes and frozen evidence
        run: node scripts/validate-mvp-local-36-product-detail-api-integration.mjs
      - name: Revalidate frozen contracts and public service API
        run: |
          GITHUB_ACTIONS=false node scripts/validate-mvp-local-36-openapi.mjs
          GITHUB_ACTIONS=false node scripts/validate-mvp-local-36-composite-commercial-data.mjs
          GITHUB_ACTIONS=false node scripts/validate-mvp-local-36-catalog-read-model.mjs
          GITHUB_ACTIONS=false node scripts/validate-mvp-local-36-public-service-api.mjs
      - name: Unit and HTTP integration tests
        run: GITHUB_ACTIONS=false pnpm test
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm type-check
      - name: Next.js build
        run: pnpm build
      - name: Storybook build
        run: pnpm build-storybook
      - name: Upload Product Detail validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-detail-validation-${{ github.sha }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            qa/screen-gates/PRODUCT-DETAIL-PUBLIC-API-INTEGRATION-V1/
            manifests/PRODUCT-DETAIL-PUBLIC-API-INTEGRATION-V1.json

  c001-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GATE_SOURCE_SHA: ${{ github.sha }}
      GATE_SOURCE_BRANCH: ${{ github.ref_name }}
      SCREEN_ID: C-001
      SCREEN_ROUTE: /splash
      SCREEN_STATES: '["initial","loading","transition","offline","error","timeout","maintenance","ready-location","ready-home","reduced-motion"]'
      BASE_SHA: fe62966daca8bda94610aa1a63702a1e543b0ce6
      PROTECTED_PATHS: '["apps/ui-lab/app/splash/","packages/ui/src/screens/splash/","tests/unit/splash","tests/accessibility/splash","tests/functional/splash","tests/visual/splash","manifests/C-001"]'
      TEST_SUITES: '["unit","axe","functional","console","visual","responsive","frozen-baseline"]'
      REQUIRED_VIEWPORTS: '["360x800","390x844","1170x2532"]'
      MANIFEST_PATH: manifests/C-001.json
      BASELINE_MODE: GATE_VALIDATION
    steps:
      - name: Checkout exact child commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify child source and C-001 frozen ancestry
        run: |
          test "$(git rev-parse HEAD)" = "$GATE_SOURCE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate C-001 contract and generated Design Tokens
        run: |
          node scripts/validate-screen-contract.mjs
          pnpm tokens:check
      - name: C-001 static, unit and build validation
        run: |
          pnpm lint
          pnpm type-check
          GITHUB_ACTIONS=false pnpm test
          pnpm build
          pnpm build-storybook
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: C-001 frozen browser regression and identity
        run: |
          pnpm test:c001:a11y
          pnpm test:c001:functional
          pnpm test:c001:visual
          git diff --exit-code "$BASE_SHA" -- \
            apps/ui-lab/app/splash/ \
            packages/ui/src/screens/splash/ \
            tests/unit/splash \
            tests/accessibility/splash \
            tests/functional/splash \
            tests/visual/splash \
            manifests/C-001.json \
            manifests/C-001-assets.json \
            manifests/C-001-visual-baseline.json
          test "$(git rev-parse HEAD:manifests/C-001.json)" = "cf13550b0561514bef0fd09844928de5343a1bb4"
          test "$(git rev-parse HEAD:manifests/C-001-assets.json)" = "cd17c6a0777ddac97f7d1f5e811547bbba134aa0"
          test "$(git rev-parse HEAD:manifests/C-001-visual-baseline.json)" = "951055d7d39e1cb7abf05ac4b3a8e214421aa1a1"
          test "$(git rev-parse HEAD:tests/visual/splash.visual.spec.ts)" = "822e33e97a4f426fd80a10b6e8a5e1134c0bb8f6"
      - name: Upload C-001 regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c001-regression-${{ github.sha }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            playwright-report/
            test-results/
            screenshots/c001/
            qa/screen-gates/C-001/
            qa/c001/
            manifests/C-001.json
            manifests/C-001-assets.json
            manifests/C-001-visual-baseline.json

  c002-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GATE_SOURCE_SHA: ${{ github.sha }}
      GATE_SOURCE_BRANCH: ${{ github.ref_name }}
      SCREEN_ID: C-002
      SCREEN_ROUTE: /location
      SCREEN_STATES: '["idle","requesting_permission","locating","reverse_geocoding","manual_entry","validating_manual_address","resolved","checking_service_area","permission_denied","location_unavailable","timeout","offline","network_error","invalid_address","out_of_area","retrying","success","reduced_motion","long_address","hotel","condominium"]'
      BASE_SHA: fe62966daca8bda94610aa1a63702a1e543b0ce6
      C002_BASE_SHA: fe62966daca8bda94610aa1a63702a1e543b0ce6
      PROTECTED_PATHS: '["apps/ui-lab/app/location/","packages/location/","packages/ui/src/screens/location/","tests/unit/location","tests/accessibility/location","tests/functional/location","tests/visual/location","manifests/C-002"]'
      TEST_SUITES: '["unit","coverage","axe","functional","console","visual","responsive","frozen-baseline"]'
      REQUIRED_VIEWPORTS: '["360x800","390x844","1170x2532"]'
      MANIFEST_PATH: manifests/C-002.json
      BASELINE_MODE: GATE_VALIDATION
    steps:
      - name: Checkout exact child commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify child source and C-002 frozen ancestry
        run: |
          test "$(git rev-parse HEAD)" = "$GATE_SOURCE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate C-002 contract and generated Design Tokens
        run: |
          node scripts/validate-screen-contract.mjs
          pnpm tokens:check
      - name: C-002 static, unit, coverage and build validation
        run: |
          pnpm lint
          pnpm type-check
          GITHUB_ACTIONS=false pnpm test
          GITHUB_ACTIONS=false pnpm test:coverage
          pnpm build
          pnpm build-storybook
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: C-002 frozen browser regression and identity
        run: |
          pnpm test:c002:a11y
          pnpm test:c002:functional
          pnpm test:c002:visual
          git diff --exit-code "$BASE_SHA" -- \
            apps/ui-lab/app/location/ \
            packages/location/ \
            packages/ui/src/screens/location/ \
            tests/unit/location \
            tests/accessibility/location \
            tests/functional/location \
            tests/visual/location \
            manifests/C-002.json \
            manifests/C-002-assets.json \
            manifests/C-002-visual-baseline.json
          test "$(git rev-parse HEAD:manifests/C-002.json)" = "20a8980659774590c2a42a27fcc74f5c0d3015c3"
          test "$(git rev-parse HEAD:manifests/C-002-assets.json)" = "cadb916200edda1dba1515ce1d75abd3e19647e6"
          test "$(git rev-parse HEAD:manifests/C-002-visual-baseline.json)" = "5b655732d5df284b2336565ee1e2e2eee4774848"
          test "$(git rev-parse HEAD:tests/visual/location.visual.spec.ts-snapshots)" = "ab35f0e0495c19a6cb765be7610cfbb99859d589"
          pnpm audit:all
      - name: Upload C-002 regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c002-regression-${{ github.sha }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            playwright-report/
            test-results/
            screenshots/
            coverage/
            qa/screen-gates/C-002/
            qa/c002/
            tests/visual/location.visual.spec.ts-snapshots/

  c005-frozen-regression:
    uses: ./.github/workflows/reusable-screen-gate.yml
    with:
      sourceSha: fe62966daca8bda94610aa1a63702a1e543b0ce6
      screenId: C-005
      route: /
      states: '["ready","loading","closed","high-demand","error","empty-cart","alcohol-cutoff","out-of-area"]'
      baseSha: c2857afe538b2cf5ba44635edd56dbd422c0e2f0
      protectedPaths: '["packages/ui/src/screens/home/","tests/unit/home","tests/accessibility/home","tests/functional/home","tests/visual/home","manifests/C-005"]'
      testSuites: '["unit","axe","functional","console","visual","responsive"]'
      requiredViewports: '["360x800","390x844","1170x2532"]'
      manifestPath: manifests/C-005.json
      baselineMode: GATE_VALIDATION

  home-catalog-integration-regression:
    needs: product-detail-validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FROZEN_PARENT_SHA: 274d72db6babbf2605d7fecc9946adb28fbd6593
      BASELINE_MODE: GATE_VALIDATION
    steps:
      - name: Checkout exact child commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify frozen Home integration files
        run: |
          git merge-base --is-ancestor "$FROZEN_PARENT_SHA" HEAD
          git diff --exit-code "$FROZEN_PARENT_SHA" -- \
            .github/workflows/mvp-local-36-home-catalog-api-integration-gate.yml \
            manifests/C-005-HOME-CATALOG-API-INTEGRATION-V1.json \
            manifests/C-005-HOME-CATALOG-API-INTEGRATION-V1-BASELINE-REVIEW.json \
            playwright.home-catalog-api-integration.config.ts \
            scripts/generate-c005-home-catalog-api-integration-evidence.mjs \
            scripts/mvp-local-36-home-catalog-api-integration-changed-files.mjs \
            scripts/validate-c005-home-catalog-api-integration-baseline-artifact.mjs \
            scripts/validate-mvp-local-36-home-catalog-api-integration.mjs \
            tests/accessibility/home-catalog-api-integration.a11y.spec.ts \
            tests/functional/home-catalog-api-integration.functional.spec.ts \
            tests/integration/home-catalog-api-integration.database.ts \
            tests/integration/home-catalog-api-integration.fixtures.ts \
            tests/integration/home-catalog-api-integration.global-setup.ts \
            tests/integration/home-catalog-api-integration.global-teardown.ts \
            tests/visual/home-catalog-api-integration.visual.spec.ts \
            tests/visual/home-catalog-api-integration.visual.spec.ts-snapshots
          test "$(find tests/visual/home-catalog-api-integration.visual.spec.ts-snapshots -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')" = "12"
          echo "d351d920950ba112b622d22fe5f512a3756ef0e402622b4c82dfde350e7d07f3  manifests/C-005-HOME-CATALOG-API-INTEGRATION-V1.json" | sha256sum --check
          echo "223d245c95890a291a8d6eff769a9dacb612ef3511359f0c3875d83d2b46d671  manifests/C-005-HOME-CATALOG-API-INTEGRATION-V1-BASELINE-REVIEW.json" | sha256sum --check
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Home integration accessibility regression
        env:
          PLAYWRIGHT_EVIDENCE_PHASE: a11y
        run: pnpm exec playwright test tests/accessibility/home-catalog-api-integration.a11y.spec.ts --config playwright.home-catalog-api-integration.config.ts
      - name: Home integration functional and console regression
        env:
          PLAYWRIGHT_EVIDENCE_PHASE: functional
        run: pnpm exec playwright test tests/functional/home-catalog-api-integration.functional.spec.ts --config playwright.home-catalog-api-integration.config.ts
      - name: Home integration strict visual regression
        env:
          PLAYWRIGHT_EVIDENCE_PHASE: visual
        run: pnpm exec playwright test tests/visual/home-catalog-api-integration.visual.spec.ts --config playwright.home-catalog-api-integration.config.ts
      - name: Upload Home integration regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-catalog-integration-regression-${{ github.sha }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            playwright-report/C-005-HOME-CATALOG-API-INTEGRATION-V1/
            test-results/C-005-HOME-CATALOG-API-INTEGRATION-V1/
            screenshots/C-005-HOME-CATALOG-API-INTEGRATION-V1/
            qa/screen-gates/C-005-HOME-CATALOG-API-INTEGRATION-V1/canonical-database-audit.json

  product-detail-gate:
    needs: product-detail-validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GATE_SOURCE_SHA: ${{ github.sha }}
      GATE_SOURCE_BRANCH: ${{ github.ref_name }}
      SNAPSHOT_PATH: tests/visual/product-detail-api-integration.visual.spec.ts-snapshots
      BASELINE_REVIEW_PATH: manifests/PRODUCT-DETAIL-PUBLIC-API-INTEGRATION-V1-BASELINE-REVIEW.json
      FROZEN_PARENT_SHA: 274d72db6babbf2605d7fecc9946adb28fbd6593
    steps:
      - name: Checkout exact child commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate Product Detail scope for candidate evidence
        id: candidate_scope
        run: node scripts/validate-mvp-local-36-product-detail-api-integration.mjs
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Select isolated Product Detail baseline mode
        id: baseline
        run: |
          tracked_count="$(git ls-files "$SNAPSHOT_PATH/*.png" | wc -l | tr -d ' ')"
          if [ "$tracked_count" = "0" ]; then
            test ! -e "$BASELINE_REVIEW_PATH"
            test "$(git rev-parse HEAD^)" = "$FROZEN_PARENT_SHA"
            echo "mode=BASELINE_AUTHORING" >> "$GITHUB_OUTPUT"
            echo "tracked_count=0" >> "$GITHUB_OUTPUT"
          elif [ "$tracked_count" = "12" ]; then
            test -f "$BASELINE_REVIEW_PATH"
            candidate_sha="$(node -p "require('./$BASELINE_REVIEW_PATH').candidateCommitSha")"
            test "$candidate_sha" = "$(git rev-parse HEAD^)"
            test "$(git rev-parse "$candidate_sha^")" = "$FROZEN_PARENT_SHA"
            echo "mode=GATE_VALIDATION" >> "$GITHUB_OUTPUT"
            echo "tracked_count=12" >> "$GITHUB_OUTPUT"
          else
            echo "Expected zero bootstrap snapshots or exactly 12 Product Detail snapshots; found $tracked_count" >&2
            exit 1
          fi
      - name: Verify reviewed Product Detail baseline provenance
        id: provenance
        if: steps.baseline.outputs.mode == 'GATE_VALIDATION'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const review = JSON.parse(fs.readFileSync(process.env.BASELINE_REVIEW_PATH, 'utf8'));
            const runId = Number(review.candidateWorkflowRunId);
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            if (run.head_sha !== review.candidateCommitSha) {
              core.setFailed('Product Detail candidate workflow SHA differs.');
              return;
            }
            if (run.head_branch !== 'hielya/mvp-local-36-product-detail-api-integration') {
              core.setFailed('Product Detail candidate workflow branch differs.');
              return;
            }
            if (run.name !== 'MVP Local 36 Product Detail Public API Integration Gate') {
              core.setFailed('Product Detail candidate workflow identity differs.');
              return;
            }
            if (run.event !== 'push' || run.status !== 'completed' || run.conclusion !== 'failure') {
              core.setFailed('Product Detail authoring run must be a completed push with deliberate failure.');
              return;
            }
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
              per_page: 100,
            });
            const matches = data.artifacts.filter(({ name }) => name === review.candidateArtifactName);
            if (matches.length !== 1 || matches[0].expired) {
              core.setFailed('Exactly one non-expired Product Detail candidate artifact is required.');
              return;
            }
            const [artifact] = matches;
            if (artifact.digest !== review.candidateArtifactDigest) {
              core.setFailed('Product Detail candidate artifact digest differs.');
              return;
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
              per_page: 100,
            });
            const gateJobs = jobs.filter(({ name }) => name === 'product-detail-gate');
            if (gateJobs.length !== 1 || gateJobs[0].conclusion !== 'failure') {
              core.setFailed('Exactly one deliberately failed product-detail-gate job is required.');
              return;
            }
            const expectedSteps = new Map([
              ['Validate Product Detail scope for candidate evidence', 'success'],
              ['Select isolated Product Detail baseline mode', 'success'],
              ['Product Detail accessibility', 'success'],
              ['Product Detail functional and console validation', 'success'],
              ['Author isolated Product Detail baseline candidate', 'success'],
              ['Verify frozen parent screen evidence', 'success'],
              ['Derive fail-closed Product Detail evidence status', 'success'],
              ['Generate status-aware Product Detail evidence', 'success'],
              ['Upload versioned Product Detail evidence', 'success'],
              ['Require Product Detail baseline materialization and review', 'failure'],
            ]);
            for (const [name, conclusion] of expectedSteps) {
              const matches = gateJobs[0].steps.filter((step) => step.name === name);
              if (matches.length !== 1 || matches[0].conclusion !== conclusion) {
                core.setFailed(`Product Detail candidate step differs: ${name} must be ${conclusion}.`);
                return;
              }
            }
            core.setOutput('artifact-id', String(artifact.id));
      - name: Download and validate reviewed Product Detail artifact
        id: candidate_artifact
        if: steps.baseline.outputs.mode == 'GATE_VALIDATION'
        env:
          ARTIFACT_ID: ${{ steps.provenance.outputs.artifact-id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_zip="$RUNNER_TEMP/product-detail-${GITHUB_RUN_ID}.zip"
          artifact_directory="$(mktemp -d "$RUNNER_TEMP/product-detail.XXXXXX")"
          curl --fail --silent --show-error --location --retry 3 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output "$artifact_zip"
          unzip -q "$artifact_zip" -d "$artifact_directory"
          node scripts/validate-product-detail-api-integration-baseline-artifact.mjs "$artifact_directory"
      - name: Product Detail accessibility
        id: a11y
        env:
          PLAYWRIGHT_EVIDENCE_PHASE: a11y
        run: pnpm exec playwright test tests/accessibility/product-detail-api-integration.a11y.spec.ts --config playwright.product-detail-api-integration.config.ts
      - name: Product Detail functional and console validation
        id: functional
        env:
          PLAYWRIGHT_EVIDENCE_PHASE: functional
        run: pnpm exec playwright test tests/functional/product-detail-api-integration.functional.spec.ts --config playwright.product-detail-api-integration.config.ts
      - name: Author isolated Product Detail baseline candidate
        id: authoring
        if: steps.baseline.outputs.mode == 'BASELINE_AUTHORING'
        env:
          BASELINE_MODE: BASELINE_AUTHORING
          PLAYWRIGHT_EVIDENCE_PHASE: visual
        run: |
          pnpm exec playwright test tests/visual/product-detail-api-integration.visual.spec.ts --config playwright.product-detail-api-integration.config.ts
          test "$(find "$SNAPSHOT_PATH" -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')" = "12"
      - name: Product Detail strict visual regression
        id: strict_visual
        if: steps.baseline.outputs.mode == 'GATE_VALIDATION'
        env:
          BASELINE_MODE: GATE_VALIDATION
          PLAYWRIGHT_EVIDENCE_PHASE: visual
        run: pnpm exec playwright test tests/visual/product-detail-api-integration.visual.spec.ts --config playwright.product-detail-api-integration.config.ts
      - name: Verify frozen parent screen evidence
        id: frozen
        if: always()
        run: |
          git diff --exit-code "$FROZEN_PARENT_SHA" -- \
            manifests/C-001.json \
            manifests/C-002.json \
            manifests/C-005.json \
            manifests/C-005-HOME-CATALOG-API-INTEGRATION-V1.json \
            manifests/C-005-HOME-CATALOG-API-INTEGRATION-V1-BASELINE-REVIEW.json \
            tests/visual/home.visual.spec.ts-snapshots \
            tests/visual/location.visual.spec.ts-snapshots \
            tests/visual/splash.visual.spec.ts-snapshots \
            tests/visual/home-catalog-api-integration.visual.spec.ts-snapshots
      - name: Derive fail-closed Product Detail evidence status
        id: evidence_status
        if: always()
        env:
          BASELINE_MODE: ${{ steps.baseline.outputs.mode }}
          CANDIDATE_SCOPE_OUTCOME: ${{ steps.candidate_scope.outcome }}
          PROVENANCE_OUTCOME: ${{ steps.provenance.outcome }}
          CANDIDATE_ARTIFACT_OUTCOME: ${{ steps.candidate_artifact.outcome }}
          A11Y_OUTCOME: ${{ steps.a11y.outcome }}
          FUNCTIONAL_OUTCOME: ${{ steps.functional.outcome }}
          AUTHORING_OUTCOME: ${{ steps.authoring.outcome }}
          STRICT_VISUAL_OUTCOME: ${{ steps.strict_visual.outcome }}
          FROZEN_OUTCOME: ${{ steps.frozen.outcome }}
        run: |
          status="QA_FAILED_OR_INCOMPLETE"
          if [ "$BASELINE_MODE" = "BASELINE_AUTHORING" ] \
            && [ "$CANDIDATE_SCOPE_OUTCOME" = "success" ] \
            && [ "$A11Y_OUTCOME" = "success" ] \
            && [ "$FUNCTIONAL_OUTCOME" = "success" ] \
            && [ "$AUTHORING_OUTCOME" = "success" ] \
            && [ "$FROZEN_OUTCOME" = "success" ]; then
            status="BASELINE_CANDIDATE"
          elif [ "$BASELINE_MODE" = "GATE_VALIDATION" ] \
            && [ "$CANDIDATE_SCOPE_OUTCOME" = "success" ] \
            && [ "$PROVENANCE_OUTCOME" = "success" ] \
            && [ "$CANDIDATE_ARTIFACT_OUTCOME" = "success" ] \
            && [ "$A11Y_OUTCOME" = "success" ] \
            && [ "$FUNCTIONAL_OUTCOME" = "success" ] \
            && [ "$STRICT_VISUAL_OUTCOME" = "success" ] \
            && [ "$FROZEN_OUTCOME" = "success" ]; then
            status="QA_PASSED_CANDIDATE"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Generate status-aware Product Detail evidence
        if: always()
        env:
          EVIDENCE_STATUS: ${{ steps.evidence_status.outputs.status }}
        run: node scripts/generate-product-detail-api-integration-evidence.mjs
      - name: Upload versioned Product Detail evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-detail-public-api-integration-v1-${{ github.sha }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            playwright-report/PRODUCT-DETAIL-PUBLIC-API-INTEGRATION-V1/
            test-results/PRODUCT-DETAIL-PUBLIC-API-INTEGRATION-V1/
            screenshots/PRODUCT-DETAIL-PUBLIC-API-INTEGRATION-V1/
            qa/screen-gates/PRODUCT-DETAIL-PUBLIC-API-INTEGRATION-V1/
            manifests/PRODUCT-DETAIL-PUBLIC-API-INTEGRATION-V1-BASELINE-REVIEW.json
            manifests/PRODUCT-DETAIL-PUBLIC-API-INTEGRATION-V1.json
            tests/visual/product-detail-api-integration.visual.spec.ts-snapshots/
      - name: Require Product Detail baseline materialization and review
        if: steps.baseline.outputs.mode == 'BASELINE_AUTHORING'
        run: |
          echo "BASELINE_AUTHORING_PENDING=true"
          echo "Inspect all 12 Product Detail candidate PNGs, then materialize only the PNGs and hash-bound review manifest in a second commit." >&2
          exit 1

  gate-summary:
    needs:
      - product-detail-validation
      - c001-regression
      - c002-regression
      - c005-frozen-regression
      - home-catalog-integration-regression
      - product-detail-gate
    runs-on: ubuntu-latest
    steps:
      - name: Record Product Detail Public API Integration Gate outcome
        run: |
          echo "PRODUCT_DETAIL_PUBLIC_API_INTEGRATION_VALIDATED=true"
          echo "FROZEN_PARENT_SHA=274d72db6babbf2605d7fecc9946adb28fbd6593"
