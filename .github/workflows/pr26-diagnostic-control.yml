name: PR26 Diagnostic Control
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
env:
  CI: 'true'
  BASELINE_MODE: GATE_VALIDATION
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        source:
          - label: main-control
            sha: e4fc9d5b9675d2d20d7a71cf45ff6f4fb985c0f0
          - label: token-candidate
            sha: aca0ebaf3e409c4b90198d9dee8854135c0c9f50
        suite: [freeze, home, quote-success]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record exact source and color
        env:
          EXPECTED_SHA: ${{ matrix.source.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git rev-parse HEAD
          cat packages/ui/src/styles/actions.css
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Freeze validators only
        if: matrix.suite == 'freeze'
        run: pnpm exec vitest run tests/unit/mvp-local-36-openapi.test.ts tests/unit/mvp-local-36-composite-commercial-data.test.ts
      - run: pnpm build
        if: matrix.suite != 'freeze'
      - run: pnpm exec playwright install --with-deps chromium
        if: matrix.suite != 'freeze'
      - name: Legacy Home functional and visual tests
        if: matrix.suite == 'home'
        run: pnpm exec playwright test tests/functional/home.functional.spec.ts tests/visual/home.visual.spec.ts --config playwright.config.ts --update-snapshots=none --forbid-only --workers=1
      - name: Only success 2.5 km quote visual
        if: matrix.suite == 'quote-success'
        run: pnpm exec playwright test tests/visual/c002-delivery-quote-api-alignment.visual.spec.ts --grep 'success 2\\.5 km /' --config playwright.c002-delivery-quote-api-alignment.config.ts --update-snapshots=none --forbid-only
      - name: Verify source and baselines unchanged
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard -- tests)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-${{ matrix.source.label }}-${{ matrix.suite }}
          if-no-files-found: warn
          path: |
            playwright-report/
            test-results/
