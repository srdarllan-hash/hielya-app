name: Pre-Gate2 Source Export

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export-source:
    if: github.head_ref == 'hielya/pre-gate2-architecture-consolidation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Record source identity
        run: |
          git rev-parse HEAD > SOURCE_SHA.txt
          printf '%s\n' "${{ github.head_ref }}" > SOURCE_BRANCH.txt
      - name: Upload exact repository source
        uses: actions/upload-artifact@v4
        with:
          name: pre-gate2-source-${{ github.event.pull_request.head.sha }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .
            !.git/**
            !node_modules/**
            !.next/**
            !storybook-static/**
            !playwright-report/**
            !test-results/**
