  "components": {
    "securitySchemes": {
      "customerBearer": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "OpaqueSessionToken",
        "description": "Opaque token; only its hash is stored server-side. The revocable session has an absolute 30-day lifetime, is not a JSON Web Token, and has no refresh token."
      },
      "courierBearer": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "OpaqueCourierCredential",
        "description": "Future workforce identity, separate from customer session. Never accept customerBearer for courier commands. Require assigned courier and object-level access; no admin remote age override. Not implemented/issued in Phase1."
      },
      "operatorBearer": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "OpaqueOperatorCredential",
        "description": "Future store operator authorization for order acceptance/preparation, not permission to bypass handover or impersonate courier. Not implemented in Phase1."
      }
    },
    "schemas": {
      "AlcoholAvailability": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "status",
          "reason",
          "snapshot"
        ],
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "AVAILABLE",
              "UNAVAILABLE"
            ]
          },
          "reason": {
            "type": "string",
            "enum": [
              "ELIGIBLE",
              "CUTOFF_REACHED",
              "STORE_NOT_OPEN",
              "SLA_UNAVAILABLE"
            ]
          },
          "snapshot": {
            "oneOf": [
              {
                "$ref": "#/components/schemas/AlcoholQuoteSnapshot"
              },
              {
                "type": "null"
              }
            ]
          }
        },
        "allOf": [
          {
            "if": {
              "properties": {
                "status": {
                  "const": "AVAILABLE"
                }
              }
            },
            "then": {
              "properties": {
                "reason": {
                  "const": "ELIGIBLE"
                },
                "snapshot": {
                  "$ref": "#/components/schemas/AlcoholQuoteSnapshot"
                }
              }
            },
            "else": {
              "properties": {
                "reason": {
                  "type": "string",
                  "enum": [
                    "CUTOFF_REACHED",
                    "STORE_NOT_OPEN",
                    "SLA_UNAVAILABLE"
                  ]
                }
              }
            }
          },
          {
            "if": {
              "properties": {
                "reason": {
                  "const": "SLA_UNAVAILABLE"
                }
              }
            },
            "then": {
              "properties": {
                "snapshot": {
                  "type": "null"
                }
              }
            }
          },
          {
            "if": {
              "properties": {
                "reason": {
                  "const": "CUTOFF_REACHED"
                }
              }
            },
            "then": {
              "properties": {
                "snapshot": {
                  "$ref": "#/components/schemas/AlcoholQuoteSnapshot"
                }
              }
            }
          }
        ],
        "description": "AVAILABLE is informational, never purchase authorization. At serverNow >= computed cutoff use CUTOFF_REACHED. Invalid/stale/missing estimate => SLA_UNAVAILABLE, null snapshot, no 45-minute fallback."
      },
      "AlcoholQuoteSnapshot": {
