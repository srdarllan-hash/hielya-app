    "/checkout/reservations": {
      "post": {
        "operationId": "reserveRuntimeCart",
        "description": "Revalidates after routing within SQLite write transaction. Reservation TTL600seconds. At expiration preserve cart/items and release stock; explicit new action/key revalidates everything. No order/payment. Same key cannot renew after expiration/edit; replay returns current cart. Existing active reservation is never extended; conflicting address fails. HTTP409 with valid=false returns the failed validation and creates no reservation.",
        "security": [
          {
            "customerBearer": []
          }
        ],
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 16,
              "maxLength": 128,
              "pattern": "^[!-~]+$"
            }
          }
        ],
        "responses": {
          "201": {
            "description": "Current reservation result; an idempotent replay never renews an expired or cancelled reservation.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RuntimeCartValidation"
                }
              }
            }
