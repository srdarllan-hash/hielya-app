              }
            }
          },
          {
            "if": {
              "properties": {
                "demand": {
                  "properties": {
                    "level": {
                      "const": "UNKNOWN"
                    }
                  }
                }
              }
            },
            "then": {
              "properties": {
                "alcohol": {
                  "properties": {
