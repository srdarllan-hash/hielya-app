{
  "openapi": "3.1.1",
  "jsonSchemaDialect": "https://json-schema.org/draft/2020-12/schema",
  "info": {
    "title": "HIELYA customer session HTTP cookie contract",
    "version": "1.5.0",
    "description": "Issue #75. Scoped successor to V1.2 authentication. Cookie authentication also supplies existing V1.4 cart routes; cart IDs remain in memory. All domain contracts and production gates remain unchanged."
  },
  "servers": [
    {
      "url": "/api/v1",
      "description": "Relative API base; the host is environment-specific."
    }
  ],
  "paths": {
    "/auth/otp/request": {
      "post": {
        "tags": [
          "Auth"
        ],
        "summary": "Request a customer OTP challenge",
        "operationId": "requestCustomerOtp",
        "security": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/OtpRequest"
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "OTP challenge accepted. Replays during cooldown return the same challenge without another delivery.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/OtpChallenge"
                },
                "example": {
                  "challengeId": "00000000-0000-4000-8000-000000000001",
                  "expiresInSeconds": 300,
                  "resendAfterSeconds": 60
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              },
              "Pragma": {
                "schema": {
                  "type": "string",
                  "const": "no-cache"
                }
              },
              "X-Correlation-ID": {
                "schema": {
                  "type": "string",
                  "format": "uuid"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/AuthBadRequest"
          },
          "429": {
            "$ref": "#/components/responses/AuthTooManyRequests"
          },
          "503": {
            "$ref": "#/components/responses/AuthServiceUnavailable"
          }
        }
      }
    },
    "/auth/otp/verify": {
      "post": {
        "tags": [
          "Auth"
        ],
        "summary": "Verify a customer OTP and create one opaque session",
        "operationId": "verifyCustomerOtp",
        "security": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/OtpVerify"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Customer authenticated with one opaque, revocable session.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/OpaqueSessionAuthentication"
                },
                "example": {
                  "expiresInSeconds": 2592000,
                  "customer": {
                    "id": "00000000-0000-4000-8000-000000000002",
                    "phoneE164": "+34612345678",
                    "phoneVerifiedAt": "2030-01-01T12:00:00.000Z",
                    "status": "ACTIVE"
                  }
                }
              }
            },
            "headers": {
              "Set-Cookie": {
                "description": "hielya_session credential, sent only in this header. HttpOnly; Secure; SameSite=Strict; Path=/; Max-Age is the nonnegative remaining lifetime derived from the existing absolute session expiry. No Domain attribute.",
                "schema": {
                  "type": "string"
                }
              },
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              },
              "Pragma": {
                "schema": {
                  "type": "string",
                  "const": "no-cache"
                }
              },
              "X-Correlation-ID": {
                "schema": {
                  "type": "string",
                  "format": "uuid"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/AuthBadRequest"
          },
          "429": {
            "$ref": "#/components/responses/AuthTooManyRequests"
          },
          "503": {
            "$ref": "#/components/responses/AuthServiceUnavailable"
          }
        }
      }
    },
    "/auth/session": {
      "get": {
        "tags": [
          "Auth"
        ],
        "operationId": "getCustomerSession",
        "summary": "Restore authentication state using the existing session validator",
        "security": [
          {
            "customerSession": []
          }
        ],
        "responses": {
          "200": {
            "description": "Authenticated customer and remaining absolute lifetime; no credential or Set-Cookie.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/OpaqueSessionAuthentication"
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              },
              "Pragma": {
                "schema": {
                  "type": "string",
                  "const": "no-cache"
                }
              },
              "X-Correlation-ID": {
                "schema": {
                  "type": "string",
                  "format": "uuid"
                }
              }
            }
          },
          "400": {
            "description": "Safe authentication error envelope.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AuthPublicError"
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              },
              "Pragma": {
                "schema": {
                  "type": "string",
                  "const": "no-cache"
                }
              },
              "X-Correlation-ID": {
                "schema": {
                  "type": "string",
                  "format": "uuid"
                }
              }
            }
          },
          "401": {
            "description": "Safe authentication error envelope.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AuthPublicError"
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              },
              "Pragma": {
                "schema": {
                  "type": "string",
                  "const": "no-cache"
                }
              },
              "X-Correlation-ID": {
                "schema": {
                  "type": "string",
                  "format": "uuid"
                }
              }
            }
          },
          "503": {
            "description": "Safe authentication error envelope.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AuthPublicError"
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              },
              "Pragma": {
                "schema": {
                  "type": "string",
                  "const": "no-cache"
                }
              },
              "X-Correlation-ID": {
                "schema": {
                  "type": "string",
                  "format": "uuid"
                }
              }
            }
          }
        }
      }
    },
    "/auth/logout": {
      "post": {
        "tags": [
          "Auth"
        ],
        "operationId": "logoutCustomerSession",
        "summary": "Revoke the session and clear its cookie; missing, expired or revoked cookies also succeed",
        "description": "SameSite=Strict and JSON-content-type POST mutations are the CSRF boundary. Submit an empty JSON object; form submissions are rejected.",
        "security": [
          {},
          {
            "customerSession": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "properties": {}
              }
            }
          }
        },
        "responses": {
          "204": {
            "description": "Session revoked or already invalid. Empty body.",
            "headers": {
              "Set-Cookie": {
                "description": "hielya_session=; HttpOnly; Secure; SameSite=Strict; Path=/; Max-Age=0",
                "schema": {
                  "type": "string"
                }
              },
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              },
              "Pragma": {
                "schema": {
                  "type": "string",
                  "const": "no-cache"
                }
              },
              "X-Correlation-ID": {
                "schema": {
                  "type": "string",
                  "format": "uuid"
                }
              }
            }
          },
          "400": {
            "description": "Safe authentication error envelope.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AuthPublicError"
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              },
              "Pragma": {
                "schema": {
                  "type": "string",
                  "const": "no-cache"
                }
              },
              "X-Correlation-ID": {
                "schema": {
                  "type": "string",
                  "format": "uuid"
                }
              }
            }
          },
          "503": {
            "description": "Safe authentication error envelope.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AuthPublicError"
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              },
              "Pragma": {
                "schema": {
                  "type": "string",
                  "const": "no-cache"
                }
              },
              "X-Correlation-ID": {
                "schema": {
                  "type": "string",
                  "format": "uuid"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "customerSession": {
        "type": "apiKey",
        "in": "cookie",
        "name": "hielya_session",
        "description": "Opaque revocable session. HttpOnly; Secure; SameSite=Strict; Path=/. Absolute expiry remains 2592000 seconds; never renewed."
      }
    },
    "schemas": {
      "OtpRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "phoneE164",
          "locale"
        ],
        "properties": {
          "phoneE164": {
            "type": "string",
            "pattern": "^\\+34[0-9]{9}$"
          },
          "locale": {
            "type": "string",
            "enum": [
              "es-ES",
              "en-GB",
              "pt-BR"
            ]
          }
        }
      },
      "OtpChallenge": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "challengeId",
          "expiresInSeconds",
          "resendAfterSeconds"
        ],
        "properties": {
          "challengeId": {
            "type": "string",
            "format": "uuid"
          },
          "expiresInSeconds": {
            "type": "integer",
            "minimum": 0
          },
          "resendAfterSeconds": {
            "type": "integer",
            "minimum": 0
          }
        }
      },
      "OtpVerify": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "challengeId",
          "code"
        ],
        "properties": {
          "challengeId": {
            "type": "string",
            "format": "uuid"
          },
          "code": {
            "type": "string",
            "pattern": "^[0-9]{6}$"
          }
        }
      },
      "AuthenticatedCustomer": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "phoneE164",
          "phoneVerifiedAt",
          "status"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "phoneE164": {
            "type": "string",
            "pattern": "^\\+34[0-9]{9}$"
          },
          "phoneVerifiedAt": {
            "type": "string",
            "format": "date-time"
          },
          "status": {
            "type": "string",
            "const": "ACTIVE"
          }
        }
      },
      "OpaqueSessionAuthentication": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "expiresInSeconds",
          "customer"
        ],
        "properties": {
          "expiresInSeconds": {
            "type": "integer",
            "minimum": 0,
            "maximum": 2592000
          },
          "customer": {
            "$ref": "#/components/schemas/AuthenticatedCustomer"
          }
        }
      },
      "PublicError": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "code",
          "message",
          "correlationId"
        ],
        "properties": {
          "code": {
            "type": "string",
            "enum": [
              "INVALID_INPUT",
              "PRODUCT_NOT_FOUND",
              "PRODUCT_UNAVAILABLE",
              "COMPOSITE_COMPONENT_UNAVAILABLE",
              "MINIMUM_NOT_REACHED",
              "INVALID_DISTANCE",
              "OUT_OF_AREA",
              "CONFIGURATION_UNAVAILABLE",
              "SESSION_INVALID"
            ]
          },
          "message": {
            "type": "string"
          },
          "field": {
            "type": [
              "string",
              "null"
            ]
          },
          "correlationId": {
            "type": "string",
            "format": "uuid"
          },
          "details": {
            "type": [
              "object",
              "null"
            ],
            "additionalProperties": true
          }
        }
      },
      "AuthPublicError": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "code",
          "message",
          "correlationId"
        ],
        "properties": {
          "code": {
            "type": "string",
            "enum": [
              "INVALID_INPUT",
              "INVALID_PHONE",
              "OTP_INVALID",
              "OTP_EXPIRED",
              "OTP_UNAVAILABLE",
              "OTP_LOCKED",
              "OTP_RESEND_COOLDOWN",
              "AUTH_CONFIGURATION_UNAVAILABLE",
              "OTP_DELIVERY_UNAVAILABLE",
              "SESSION_INVALID"
            ]
          },
          "message": {
            "type": "string"
          },
          "field": {
            "type": [
              "string",
              "null"
            ]
          },
          "correlationId": {
            "type": "string",
            "format": "uuid"
          },
          "details": {
            "type": [
              "object",
              "null"
            ],
            "additionalProperties": true
          }
        }
      }
    },
    "responses": {
      "BadRequest": {
        "description": "Invalid input or controlled business-rule failure.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/PublicError"
            }
          }
        }
      },
      "NotFound": {
        "description": "Public resource not found.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/PublicError"
            }
          }
        }
      },
      "Unauthorized": {
        "description": "Customer authentication is required or invalid.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/PublicError"
            }
          }
        }
      },
      "AuthBadRequest": {
        "description": "Invalid authentication input or a controlled OTP failure.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/AuthPublicError"
            }
          }
        }
      },
      "AuthTooManyRequests": {
        "description": "OTP attempts or resend timing temporarily blocks the operation.",
        "headers": {
          "Retry-After": {
            "description": "Whole seconds until the operation may be retried, when known.",
            "schema": {
              "type": "integer",
              "minimum": 0
            }
          }
        },
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/AuthPublicError"
            }
          }
        }
      },
      "AuthServiceUnavailable": {
        "description": "Authentication configuration or simulated delivery is unavailable.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/AuthPublicError"
            }
          }
        }
      }
    },
    "parameters": {
      "Page": {
        "name": "page",
        "in": "query",
        "schema": {
          "type": "integer",
          "minimum": 1,
          "default": 1
        }
      },
      "PageSize": {
        "name": "pageSize",
        "in": "query",
        "schema": {
          "type": "integer",
          "minimum": 1,
          "maximum": 100,
          "default": 20
        }
      }
    }
  },
