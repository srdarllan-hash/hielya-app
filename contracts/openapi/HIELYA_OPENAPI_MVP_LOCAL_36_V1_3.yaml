  "components": {
    "securitySchemes": {
      "customerBearer": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "OpaqueSessionToken",
        "description": "Opaque token; only its hash is stored server-side. The revocable session has an absolute 30-day lifetime, is not a JSON Web Token, and has no refresh token."
      },
      "courierBearer": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "OpaqueCourierCredential",
        "description": "Future workforce identity, separate from customer session. Never accept customerBearer for courier commands. Require assigned courier and object-level access; no admin remote age override. Not implemented/issued in Phase1."
      },
      "operatorBearer": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "OpaqueOperatorCredential",
        "description": "Future store operator authorization for order acceptance/preparation, not permission to bypass handover or impersonate courier. Not implemented in Phase1."
