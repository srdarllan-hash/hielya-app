                }
              }
            ]
          },
          "compensation": {
            "$ref": "#/components/schemas/Compensation"
          },
          "redeliveryAllowed": {
            "const": false
          }
        },
        "description": "202 means refusal and compensation intent committed, not that bank refund already arrived. Whole mixed or alcohol-only order remains undelivered; inspect returned goods before restocking. Replay same idempotency key returns same result, not a second physical attempt."
      },
      "RetentionPolicyV13": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "anchor",
          "generalCommercialYears",
          "inheritsOrderDossierRetention",
          "independentAgeEvidenceTtl"
        ],
        "properties": {
          "anchor": {
            "const": "LAST_ACCOUNTING_ENTRY"
          },
          "generalCommercialYears": {
            "const": 6
          },
          "inheritsOrderDossierRetention": {
            "const": true
          },
          "independentAgeEvidenceTtl": {
            "const": false
          }
        },
        "description": "Article30 commercial general period from last accounting entry, NOT order creation/delivery. Inherit dossier retentionUntil and documented legal holds/special obligations; six years is not universal cap. Restricted archive after operational need, coordinated deletion; necessity/legal basis for minimal evidence documented, no extension of unrelated customer/session data."
      },
      "ComplianceError": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "code",
          "message",
          "currentAvailability"
        ],
        "properties": {
          "code": {
            "type": "string",
            "enum": [
              "INVALID_REQUEST",
              "UNAUTHORIZED",
              "FORBIDDEN",
              "NOT_FOUND",
              "STALE_REVISION",
              "SLA_UNAVAILABLE",
              "CUTOFF_REACHED",
              "PROMISE_RECONFIRMATION_REQUIRED",
              "AGE_NOT_VERIFIED",
              "PIN_INVALID",
              "TERMINAL_REFUSAL",
              "IDEMPOTENCY_CONFLICT",
              "DELIVERY_DEADLINE_EXCEEDED",
              "SERVICE_UNAVAILABLE"
            ]
          },
          "message": {
            "type": "string",
            "minLength": 1
          },
          "currentAvailability": {
            "oneOf": [
              {
                "$ref": "#/components/schemas/OperationalAvailability"
              },
              {
                "type": "null"
              }
            ]
          }
        },
        "description": "No sensitive document data or PIN in message. Reconfirmation requires currentAvailability; do not create/charge order on quote conflict.",
        "allOf": [
          {
            "if": {
              "properties": {
                "code": {
                  "const": "PROMISE_RECONFIRMATION_REQUIRED"
                }
              }
            },
            "then": {
              "properties": {
                "currentAvailability": {
                  "$ref": "#/components/schemas/OperationalAvailability"
                }
              }
            }
          }
        ]
      }
    }
