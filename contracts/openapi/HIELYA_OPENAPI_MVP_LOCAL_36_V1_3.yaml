          "method",
          "recordedAt",
          "courierId"
        ],
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "PENDING",
              "VERIFIED_18_PLUS",
              "REFUSED_NO_ID",
              "REFUSED_MINOR",
              "REFUSED_DOUBTFUL_ID"
            ]
          },
          "method": {
            "oneOf": [
              {
                "const": "IN_PERSON_DOCUMENT_VISUAL_CHECK"
              },
              {
                "type": "null"
              }
            ]
          },
          "recordedAt": {
            "oneOf": [
              {
                "type": "string",
                "format": "date-time"
              },
              {
                "type": "null"
              }
            ]
          },
          "courierId": {
            "oneOf": [
              {
                "type": "string",
                "format": "uuid"
              },
              {
                "type": "null"
              }
            ]
          }
        },
        "allOf": [
          {
            "if": {
              "properties": {
                "status": {
                  "const": "PENDING"
                }
              }
            },
            "then": {
              "properties": {
                "method": {
                  "type": "null"
                },
                "recordedAt": {
                  "type": "null"
                },
                "courierId": {
                  "type": "null"
                }
              }
            },
            "else": {
              "properties": {
                "recordedAt": {
                  "type": "string",
                  "format": "date-time"
                },
                "courierId": {
                  "type": "string",
                  "format": "uuid"
                }
              }
            }
          },
          {
            "if": {
              "properties": {
                "status": {
                  "type": "string",
                  "enum": [
                    "VERIFIED_18_PLUS",
                    "REFUSED_MINOR",
                    "REFUSED_DOUBTFUL_ID"
                  ]
                }
              }
            },
            "then": {
              "properties": {
                "method": {
                  "const": "IN_PERSON_DOCUMENT_VISUAL_CHECK"
                }
              }
            }
          },
          {
            "if": {
              "properties": {
                "status": {
                  "const": "REFUSED_NO_ID"
                }
              }
            },
            "then": {
              "properties": {
                "method": {
                  "type": "null"
                }
              }
            }
          }
        ],
        "description": "Only result/method/server timestamp/courier actor are stored as age evidence (plus operational linkage). No photo, document number, birth date, exact age, free text or document type. PENDING on non-alcohol does not fabricate adult verification."
      },
      "AtomicHandoverInput": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "expectedRevision",
          "pin",
          "adultDocumentVisuallyVerified",
          "recipientPresent"
        ],
        "properties": {
          "expectedRevision": {
            "type": "integer",
            "minimum": 1
          },
          "pin": {
            "type": "string",
            "pattern": "^[0-9]{4}$",
            "writeOnly": true
          },
          "adultDocumentVisuallyVerified": {
            "type": "boolean"
          },
          "recipientPresent": {
            "const": true
          }
        },
        "description": "ONE final command. For alcohol adultDocumentVisuallyVerified must be true, after seeing matching photo and DOB on DNI/passport or NIE accompanied by sufficient photo/DOB document. NIE alone never qualifies: submit terminal REFUSED_DOUBTFUL_ID instead. Non-alcohol accepts false. Actor/time/containsAlcohol not accepted from caller. Confirmation is transient attestation, not retained document data. Server verifies all conditions atomically; no prior successful age-check/PIN call can authorize completion."
      },
      "RefuseAgeInput": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "expectedRevision",
          "status"
        ],
        "properties": {
          "expectedRevision": {
            "type": "integer",
            "minimum": 1
          },
          "status": {
            "$ref": "#/components/schemas/AgeRefusalStatus"
          }
        },
        "description": "Terminal refusal by assigned courier; cannot mark success. NO_ID means no document; NIE alone/photo or DOB not visible => DOUBTFUL_ID. Whole order not delivered, automatic full compensation, no redelivery/reassignment to third party. New independent order allowed only with adult present and fresh eligibility."
      },
      "DeliveryFailureInputV13": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "expectedRevision",
          "reason"
        ],
        "properties": {
          "expectedRevision": {
            "type": "integer",
            "minimum": 1
          },
          "reason": {
            "type": "string",
            "enum": [
              "CUSTOMER_ABSENT",
              "THIRD_PARTY_HANDOVER",
              "ALCOHOL_DEADLINE_EXCEEDED",
              "WRONG_PIN",
              "PIN_BLOCKED",
              "ACCESS_BLOCKED"
            ]
          }
        },
        "description": "Terminal failure, no same-order retry and no free-text document data. Do not invent age result when nobody was inspected. Verification failure compensation is integral; financial policy for other operational reasons needs approved general cancellation rules before activating those reasons."
      },
      "Compensation": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "policy",
          "status",
          "mode",
          "amountToRefundCents",
          "amountToVoidCents",
          "currency"
        ],
        "properties": {
          "policy": {
            "const": "FULL_NO_CUSTOMER_COST"
          },
          "status": {
            "type": "string",
            "enum": [
              "PENDING",
              "PROCESSING",
              "COMPLETED",
              "FAILED"
            ]
          },
          "mode": {
            "type": "string",
            "enum": [
              "VOID_AUTHORIZATION",
              "REFUND_CAPTURE",
              "REFUND_AND_VOID",
              "NO_PAYMENT"
            ]
          },
          "amountToRefundCents": {
            "type": "integer",
            "minimum": 0
          },
          "amountToVoidCents": {
            "type": "integer",
            "minimum": 0
          },
          "currency": {
            "const": "EUR"
          }
        },
        "description": "Automatic intent on verification refusal, no customer request/manual approval. Full captured outstanding total incl fees; void uncaptured authorization, partial capture refunds+voids. COMPlETED only on provider confirmation/no payment; no fees. External payment via idempotent outbox/worker in Phase4, not in database transaction."
      },
      "DeliveryCompliance": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "orderId",
          "revision",
          "status",
          "ageVerification",
          "verifiedAt",
          "verifiedByCourierId",
          "compensation"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "orderId": {
            "type": "string",
            "format": "uuid"
          },
          "revision": {
            "type": "integer",
            "minimum": 1
          },
          "status": {
            "type": "string",
            "enum": [
              "ASSIGNED",
              "OUT_FOR_DELIVERY",
              "ARRIVED",
              "DELIVERED",
              "FAILED",
              "RETURNING",
              "RETURNED"
            ]
          },
          "ageVerification": {
            "$ref": "#/components/schemas/AgeVerificationRecord"
          },
          "verifiedAt": {
            "oneOf": [
              {
                "type": "string",
                "format": "date-time"
              },
              {
                "type": "null"
              }
            ]
          },
          "verifiedByCourierId": {
            "oneOf": [
              {
                "type": "string",
                "format": "uuid"
              },
              {
                "type": "null"
              }
            ]
          },
          "compensation": {
            "oneOf": [
              {
                "$ref": "#/components/schemas/Compensation"
              },
              {
                "type": "null"
              }
            ]
          }
        },
        "description": "Restricted courier/admin view only. verifiedAt/verifiedByCourierId are projections of the one stored age decision only when VERIFIED_18_PLUS; null otherwise. No parallel identity storage. Delivered alcohol must have valid age record, current physical presence and valid PIN/deadline; enforced by transaction, not this generic response schema.",
        "allOf": [
          {
            "if": {
              "properties": {
                "ageVerification": {
                  "properties": {
                    "status": {
                      "const": "VERIFIED_18_PLUS"
                    }
                  }
                }
              }
            },
            "then": {
              "properties": {
                "verifiedAt": {
                  "type": "string",
                  "format": "date-time"
                },
                "verifiedByCourierId": {
                  "type": "string",
                  "format": "uuid"
                }
              }
            },
            "else": {
              "properties": {
                "verifiedAt": {
                  "type": "null"
                },
                "verifiedByCourierId": {
                  "type": "null"
                }
              }
            }
          },
          {
            "if": {
              "properties": {
                "ageVerification": {
                  "properties": {
                    "status": {
                      "enum": [
                        "REFUSED_NO_ID",
                        "REFUSED_MINOR",
                        "REFUSED_DOUBTFUL_ID"
                      ]
                    }
                  }
                }
              }
            },
            "then": {
              "properties": {
                "status": {
                  "enum": [
                    "FAILED",
                    "RETURNING",
                    "RETURNED"
                  ]
                },
                "compensation": {
                  "$ref": "#/components/schemas/Compensation"
                }
              }
            }
          }
        ]
      },
      "TerminalRefusalResult": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "delivery",
          "compensation",
          "redeliveryAllowed"
        ],
        "properties": {
