components:
  securitySchemes:
    customerBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Customer access token.
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Internal-user token; admin login requires 2FA.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
      description: Required for commands that create or mutate financial, order or inventory state.
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Invalid request or business-rule violation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Insufficient permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Concurrent state conflict or duplicate command.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      - correlationId
      properties:
        code:
          type: string
          example: CART_MINIMUM_NOT_REACHED
        message:
          type: string
          example: Faltam €4,30 para atingir o pedido mínimo.
        correlationId:
          type: string
          format: uuid
        details:
          type:
          - object
          - 'null'
          additionalProperties: true
    OtpRequest:
      type: object
      required:
      - phoneE164
      - locale
      properties:
        phoneE164:
          type: string
          pattern: ^\+[1-9][0-9]{7,14}$
          example: '+34612345678'
        locale:
          type: string
          enum:
          - es-ES
          - en-GB
          - pt-BR
          default: es-ES
    OtpChallenge:
      type: object
      required:
      - challengeId
      - expiresInSeconds
      - resendAfterSeconds
      properties:
        challengeId:
          type: string
          format: uuid
        expiresInSeconds:
          type: integer
          example: 300
        resendAfterSeconds:
          type: integer
          example: 45
    OtpVerify:
      type: object
      required:
      - challengeId
      - code
      properties:
        challengeId:
          type: string
          format: uuid
        code:
          type: string
          pattern: ^[0-9]{6}$
          example: '482915'
    Customer:
      type: object
      required:
      - id
      - phoneE164
      - preferredLocale
      - status
      properties:
        id:
          type: string
          format: uuid
        phoneE164:
          type: string
        email:
          type:
          - string
          - 'null'
          format: email
        fullName:
          type:
          - string
          - 'null'
        birthDate:
          type:
          - string
          - 'null'
          format: date
        preferredLocale:
          type: string
          enum:
          - es-ES
          - en-GB
          - pt-BR
        status:
          type: string
          enum:
          - ACTIVE
          - BLOCKED
          - DELETED
    CustomerPatch:
      type: object
      properties:
        email:
          type:
          - string
          - 'null'
          format: email
        fullName:
          type:
          - string
          - 'null'
          maxLength: 120
        birthDate:
          type:
          - string
          - 'null'
          format: date
        preferredLocale:
          type: string
          enum:
          - es-ES
          - en-GB
          - pt-BR
    TokenPair:
      type: object
      required:
      - accessToken
      - refreshToken
      - expiresInSeconds
      - customer
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresInSeconds:
          type: integer
        customer:
          $ref: '#/components/schemas/Customer'
    Address:
      type: object
      required:
      - id
      - type
      - line1
      - postalCode
      - city
      - countryCode
      - latitude
      - longitude
      - isWithinArea
      properties:
        id:
          type: string
          format: uuid
        type: &id004
          type: string
          enum:
          - HOME
          - HOTEL
          - BUSINESS
          - OTHER
        label: &id005
          type:
          - string
          - 'null'
        recipientName: &id006
          type: string
        recipientPhoneE164: &id007
          type: string
        line1: &id008
          type: string
        line2: &id009
          type:
          - string
          - 'null'
        buildingName: &id010
          type:
          - string
          - 'null'
        floor: &id011
          type:
          - string
          - 'null'
        apartment: &id012
          type:
          - string
          - 'null'
        intercom: &id013
          type:
          - string
          - 'null'
        hotelName: &id014
          type:
          - string
          - 'null'
        roomNumber: &id015
          type:
          - string
          - 'null'
        companyName: &id016
          type:
          - string
          - 'null'
        postalCode: &id017
          type: string
        city: &id018
          type: string
        region: &id019
          type: string
        countryCode: &id020
          type: string
          minLength: 2
          maxLength: 2
        latitude: &id021
          type: number
          format: double
        longitude: &id022
          type: number
          format: double
        instructions: &id023
          type:
          - string
          - 'null'
          maxLength: 500
        routeDistanceKm:
          type:
          - number
          - 'null'
        isWithinArea:
          type: boolean
        deliveryFeeCents:
          type:
          - integer
          - 'null'
          description: Amount in euro cents.
          minimum: 0
          example: 2999
    AddressInput:
      type: object
      required:
      - type
      - recipientName
      - recipientPhoneE164
      - line1
      - postalCode
      - city
      - region
      - countryCode
      - latitude
      - longitude
      properties:
        type: *id004
        label: *id005
        recipientName: *id006
        recipientPhoneE164: *id007
        line1: *id008
        line2: *id009
        buildingName: *id010
        floor: *id011
        apartment: *id012
        intercom: *id013
        hotelName: *id014
        roomNumber: *id015
        companyName: *id016
        postalCode: *id017
        city: *id018
        region: *id019
        countryCode: *id020
        latitude: *id021
        longitude: *id022
        instructions: *id023
    StoreStatus:
      type: object
      required:
      - state
      - opensAt
      - closesAt
      - timezone
      - minimumSubtotalCents
      - deliveryRadiusKm
      - maxActiveOrders
      properties:
        state:
          type: string
          enum:
          - OPEN
          - PAUSED
          - CLOSED
        pauseReason:
          type:
          - string
          - 'null'
        opensAt:
          type: string
          example: '10:00'
        closesAt:
          type: string
          example: '22:00'
        timezone:
          type: string
          example: Europe/Madrid
        minimumSubtotalCents:
          type: integer
          const: 2500
        deliveryRadiusKm:
          type: number
          const: 4
        maxActiveOrders:
          type: integer
          const: 3
        activeOrders:
          type: integer
        alcoholCheckoutAllowed:
          type: boolean
        alcoholCutoffAt:
          type:
          - string
          - 'null'
          format: date-time
    DeliveryQuoteRequest:
      type: object
      required:
      - latitude
      - longitude
      properties:
        latitude:
          type: number
        longitude:
          type: number
        addressType:
          type: string
          enum:
          - HOME
          - HOTEL
          - BUSINESS
          - OTHER
    DeliveryQuote:
      type: object
      required:
      - withinArea
      - routeDistanceKm
      - feeCents
      - etaMinMinutes
      - etaMaxMinutes
      properties:
        withinArea:
          type: boolean
        routeDistanceKm:
          type: number
        feeCents:
          type: integer
          description: Amount in euro cents.
          minimum: 0
          example: 2999
        etaMinMinutes:
          type: integer
        etaMaxMinutes:
          type: integer
        publicSpaceBlocked:
          type: boolean
    Category:
      type: object
      required:
      - id
      - slug
      - name
      - sortOrder
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        imageUrl:
          type:
          - string
          - 'null'
          format: uri
        sortOrder:
          type: integer
    Product:
      type: object
      required:
      - id
      - sku
      - name
      - categoryId
      - salePriceCents
      - currency
      - status
      - availableQuantity
      - maxPerOrder
      - containsAlcohol
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
          example: HYA-CER-003
        ean:
          type:
          - string
          - 'null'
        name:
          type: string
        brand:
          type: string
        categoryId:
          type: string
          format: uuid
        subcategory:
          type:
          - string
          - 'null'
        volumeLabel:
          type: string
        grossWeightKg:
          type: number
        estimatedVolumeLiters:
          type:
          - number
          - 'null'
        salePriceCents:
          type: integer
          description: Amount in euro cents.
          minimum: 0
          example: 2999
        currency:
          type: string
          const: EUR
        unitPriceLabel:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - ACTIVE
          - LOW_STOCK
          - OUT_OF_STOCK
          - PAUSED
          - BLOCKED
        availableQuantity:
          type: integer
          minimum: 0
        maxPerOrder:
          type: integer
          minimum: 1
        temperatureProfile:
          type: string
          enum:
          - CHILLED
          - FROZEN
          - CELLAR
          - AMBIENT
        readyToConsume:
          type: boolean
        containsAlcohol:
          type: boolean
        minimumAge:
          type:
          - integer
          - 'null'
        alcoholPercentage:
          type:
          - number
          - 'null'
        isCore:
          type: boolean
        imageUrl:
          type:
          - string
          - 'null'
          format: uri
        keywords:
          type: array
          items:
            type: string
    ProductPage:
      type: object
      required:
      - items
      - page
      - pageSize
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    CartItem:
      type: object
      required:
      - id
      - product
      - quantity
      - unitPriceCents
      - lineTotalCents
      properties:
        id:
          type: string
          format: uuid
        product:
          $ref: '#/components/schemas/Product'
        quantity:
          type: integer
          minimum: 1
        unitPriceCents:
          type: integer
