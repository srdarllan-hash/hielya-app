openapi: 3.1.1
info:
  title: HIELYA API
  version: 1.0.0
  summary: Contrato inicial do MVP da conveniência local HIELYA.
  description: API REST para cliente, painel administrativo, estoque, pagamentos, entrega e webhooks. O Source of Truth V1.1
    prevalece sobre mockups.
  contact:
    name: HIELYA Product & Technology
    email: support@hielya.example
  license:
    name: Proprietary
servers:
- url: https://api.staging.hielya.example/v1
  description: Staging
- url: https://api.hielya.example/v1
  description: Production (blocked until external validation)
tags:
- name: Auth
- name: Customer
- name: Store
- name: Catalog
- name: Cart
- name: Checkout
- name: Orders
- name: Payments
- name: Devices
- name: Admin Orders
- name: Admin Inventory
- name: Admin Store
- name: Admin Finance
- name: Webhooks
- name: Admin Auth
- name: Admin Audit
- name: Admin Reports
- name: Coupons
- name: Notifications
- name: Admin Coupons
paths:
  /auth/otp/request:
    post:
      tags:
      - Auth
      summary: Request customer OTP
      operationId: requestOtp
      responses:
        '202':
          description: OTP challenge created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallenge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: &id001 []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
  /auth/otp/verify:
    post:
      tags:
      - Auth
      summary: Verify customer OTP
      operationId: verifyOtp
      responses:
        '200':
          description: Authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerify'
  /auth/refresh:
    post:
      tags:
      - Auth
      summary: Refresh customer token
      operationId: refreshToken
      responses:
        '200':
          description: New token pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refreshToken
              properties:
                refreshToken:
                  type: string
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Logout current session
      operationId: logout
      responses:
        '204':
          description: Session revoked.
      security: &id002
      - customerBearer: []
  /me:
    get:
      tags:
      - Customer
      summary: Get current customer
      operationId: getMe
      responses:
        '200':
          description: Customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
      security: *id002
    patch:
      tags:
      - Customer
      summary: Update current customer
      operationId: updateMe
      responses:
        '200':
          description: Updated customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
      security: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerPatch'
  /addresses:
    get:
      tags:
      - Customer
      summary: List customer addresses
      operationId: listAddresses
      responses:
        '200':
          description: Address list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Address'
      security: *id002
    post:
      tags:
      - Customer
      summary: Create customer address
      operationId: createAddress
      responses:
        '201':
          description: Created address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '400':
          $ref: '#/components/responses/BadRequest'
      security: *id002
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
  /addresses/{addressId}:
    parameters:
    - name: addressId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    patch:
      tags:
      - Customer
      summary: Update customer address
      operationId: updateAddress
      responses:
        '200':
          description: Updated address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '404':
          $ref: '#/components/responses/NotFound'
      security: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
    delete:
      tags:
      - Customer
      summary: Delete customer address
      operationId: deleteAddress
      responses:
        '204':
          description: Address disabled.
        '404':
          $ref: '#/components/responses/NotFound'
      security: *id002
  /store/status:
    get:
      tags:
      - Store
      summary: Get public store status
      operationId: getStoreStatus
      responses:
        '200':
          description: Current store status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreStatus'
      security: *id001
  /delivery/quote:
    post:
      tags:
      - Store
      summary: Quote delivery route
      operationId: quoteDelivery
      responses:
        '200':
          description: Delivery quote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryQuote'
        '400':
          $ref: '#/components/responses/BadRequest'
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryQuoteRequest'
  /catalog/categories:
    get:
      tags:
      - Catalog
      summary: List active categories
      operationId: listCategories
      responses:
        '200':
          description: Categories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
      security: *id001
  /catalog/products:
    get:
      tags:
      - Catalog
      summary: Search and list active products
      operationId: listProducts
      responses:
        '200':
          description: Product page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
      security: *id001
      parameters:
      - name: q
        in: query
        schema:
          type: string
      - name: category
        in: query
        schema:
          type: string
      - name: availableOnly
        in: query
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
  /catalog/products/{productId}:
    get:
      tags:
      - Catalog
      summary: Get product detail
      operationId: getProduct
      responses:
        '200':
          description: Product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'
      security: *id001
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /carts:
    post:
      tags:
      - Cart
      summary: Create active cart
      operationId: createCart
      responses:
        '201':
          description: Cart created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
      security: *id001
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
  /carts/{cartId}:
    get:
      tags:
      - Cart
      summary: Get cart
      operationId: getCart
      responses:
        '200':
          description: Cart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '404':
          $ref: '#/components/responses/NotFound'
      security: *id001
      parameters:
      - name: cartId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /carts/{cartId}/items:
    post:
      tags:
      - Cart
      summary: Add product to cart
      operationId: addCartItem
      responses:
        '200':
          description: Updated cart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
      security: *id001
      parameters:
      - name: cartId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemInput'
  /carts/{cartId}/items/{itemId}:
    patch:
      tags:
      - Cart
      summary: Change cart item quantity
      operationId: updateCartItem
      responses:
        '200':
          description: Updated cart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          $ref: '#/components/responses/BadRequest'
      security: *id001
      parameters:
      - name: cartId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - quantity
              properties:
                quantity:
                  type: integer
                  minimum: 1
    delete:
      tags:
      - Cart
      summary: Remove cart item
      operationId: deleteCartItem
      responses:
        '200':
          description: Updated cart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
      security: *id001
      parameters:
      - name: cartId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /carts/{cartId}/validate:
    post:
      tags:
      - Checkout
      summary: Validate cart against all MVP rules
      operationId: validateCart
      responses:
        '200':
          description: Validation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartValidation'
      security: *id002
      parameters:
      - name: cartId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - addressId
              properties:
                addressId:
                  type: string
                  format: uuid
                couponCode:
                  type:
                  - string
                  - 'null'
                tipCents:
                  type: integer
                  description: Amount in euro cents.
                  minimum: 0
                  example: 2999
  /checkout/reservations:
    post:
      tags:
      - Checkout
      summary: Reserve inventory for checkout
      operationId: createReservation
      responses:
        '201':
          description: Reservation created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
      security: *id002
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - cartId
              - addressId
              properties:
                cartId:
                  type: string
                  format: uuid
                addressId:
                  type: string
                  format: uuid
  /orders:
    post:
      tags:
      - Orders
      summary: Create order from validated cart
      operationId: createOrder
      responses:
        '201':
          description: Order created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
      security: *id002
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderInput'
    get:
      tags:
      - Orders
      summary: List current customer orders
      operationId: listOrders
      responses:
        '200':
          description: Orders.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
      security: *id002
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
  /orders/{orderId}:
    get:
      tags:
      - Orders
      summary: Get customer order
      operationId: getOrder
      responses:
        '200':
          description: Order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'
      security: *id002
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /orders/{orderId}/cancel:
    post:
      tags:
      - Orders
      summary: Request order cancellation
      operationId: cancelOrder
      responses:
        '200':
          description: Cancellation accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
      security: *id002
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 300
  /payments/intents:
    post:
      tags:
      - Payments
      summary: Create or reuse Stripe PaymentIntent
      operationId: createPaymentIntent
      responses:
        '201':
          description: Payment intent ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
      security: *id002
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentIntentRequest'
      description: Creates one PaymentIntent per order with capture_method=manual. The server never accepts an arbitrary amount
        from the client.
  /payments/{paymentId}:
    get:
      tags:
      - Payments
      summary: Get payment state
      operationId: getPayment
      responses:
        '200':
          description: Payment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntentResponse'
        '404':
          $ref: '#/components/responses/NotFound'
      security: *id002
      parameters:
      - name: paymentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /devices:
    post:
      tags:
      - Devices
      summary: Register push device token
      operationId: registerDevice
      responses:
        '201':
          description: Device registered.
      security: *id002
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceTokenInput'
  /devices/{deviceId}:
    delete:
      tags:
      - Devices
      summary: Revoke push device token
      operationId: revokeDevice
      responses:
        '204':
          description: Token revoked.
      security: *id002
      parameters:
      - name: deviceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /admin/dashboard:
    get:
      tags:
      - Admin Orders
      summary: Get Today dashboard
      operationId: getAdminDashboard
      responses:
        '200':
          description: Operational dashboard.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
      security: &id003
      - adminBearer: []
  /admin/orders:
    get:
      tags:
      - Admin Orders
      summary: List operational order queue
      operationId: listAdminOrders
      responses:
        '200':
          description: Order queue.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminOrderSummary'
      security: *id003
      parameters:
      - name: status
        in: query
        schema:
          type: array
          items:
            $ref: '#/components/schemas/OrderStatus'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
  /admin/orders/{orderId}:
    get:
      tags:
      - Admin Orders
      summary: Get operational order detail
      operationId: getAdminOrder
      responses:
        '200':
          description: Order detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrderSummary'
      security: *id003
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /admin/orders/{orderId}/start-picking:
    post:
      tags:
      - Admin Orders
      summary: Start picking order
      operationId: startPicking
      responses:
        '200':
          description: Picking started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '409':
          $ref: '#/components/responses/Conflict'
      security: *id003
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
  /admin/orders/{orderId}/confirm-items:
    post:
      tags:
      - Admin Orders
      summary: Confirm physically available order items
      operationId: confirmOrderItems
      responses:
        '200':
          description: Order recalculated and ready for capture.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
      security: *id003
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmItemsInput'
  /admin/orders/{orderId}/capture:
    post:
      tags:
      - Admin Finance
      summary: Capture authorized Stripe payment
      operationId: captureOrderPayment
      responses:
        '200':
          description: Captured order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
      security: *id003
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptureInput'
      description: The amount must be calculated by the server and must be <= amount_capturable.
  /admin/orders/{orderId}/mark-ready:
    post:
      tags:
      - Admin Orders
      summary: Mark order ready for delivery
      operationId: markOrderReady
      responses:
        '200':
          description: Order ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
      security: *id003
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
  /admin/deliveries/{deliveryId}/start:
    post:
      tags:
      - Admin Orders
      summary: Start delivery
      operationId: startDelivery
      responses:
        '200':
          description: Delivery started.
      security: *id003
      parameters:
      - name: deliveryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
  /admin/deliveries/{deliveryId}/arrive:
    post:
      tags:
      - Admin Orders
      summary: Mark rider arrived
      operationId: markDeliveryArrived
      responses:
        '200':
          description: Arrival recorded.
      security: *id003
      parameters:
      - name: deliveryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
  /admin/deliveries/{deliveryId}/age-check:
    post:
      tags:
      - Admin Orders
      summary: Record alcohol age and identity check
      operationId: recordAgeCheck
      responses:
        '200':
          description: Age check recorded.
        '400':
          $ref: '#/components/responses/BadRequest'
      security: *id003
      parameters:
      - name: deliveryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgeCheckInput'
  /admin/deliveries/{deliveryId}/verify-pin:
    post:
      tags:
      - Admin Orders
      summary: Verify delivery PIN and complete delivery
      operationId: verifyDeliveryPin
      responses:
        '200':
          description: PIN valid; delivery completed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: *id003
      parameters:
      - name: deliveryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinVerifyInput'
  /admin/deliveries/{deliveryId}/fail:
    post:
      tags:
      - Admin Orders
      summary: Record failed delivery
      operationId: failDelivery
      responses:
        '200':
          description: Failure recorded and return workflow started.
      security: *id003
      parameters:
      - name: deliveryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryFailureInput'
  /admin/inventory/receipts:
    post:
      tags:
      - Admin Inventory
      summary: Receive supplier inventory
      operationId: receiveInventory
      responses:
        '201':
          description: Batches and movements created.
        '400':
          $ref: '#/components/responses/BadRequest'
      security: *id003
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryReceiptInput'
  /admin/inventory/adjustments:
    post:
      tags:
      - Admin Inventory
      summary: Create immutable inventory adjustment
      operationId: adjustInventory
      responses:
        '201':
          description: Adjustment movement created.
        '400':
          $ref: '#/components/responses/BadRequest'
      security: *id003
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryAdjustmentInput'
  /admin/refunds:
    post:
      tags:
      - Admin Finance
      summary: Create full or partial refund
      operationId: createRefund
      responses:
        '201':
